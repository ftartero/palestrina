<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestrina</title>
<meta name="theme-color" content="#14181D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestrina">
<style>
  :root{
    --bg:#14181D; --panel:#1B2129; --panel2:#222A33; --line:#2C3742;
    --text:#EEF3F7; --muted:#8B97A2; --faint:#5C6873;
    --petto:#E0559A; --dorso:#9FC93C; --spalle:#F08A2C; --braccia:#4F9BD6; --core:#E0779E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
        padding-bottom:150px}
  .head{display:flex; align-items:baseline; justify-content:space-between; padding:18px 20px 8px}
  .logo{font-weight:800; letter-spacing:-.3px; font-size:19px}
  .logo b{color:var(--spalle)}
  .sub{color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:2px}
  .content{padding:0 16px}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px}
  .row{display:flex; align-items:center}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input{font-family:inherit}
  /* toggle A/B */
  .seg{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:6px; display:flex; gap:6px; margin-bottom:12px}
  .seg button{flex:1; border-radius:13px; padding:11px 0; display:flex; flex-direction:column; align-items:center; color:var(--faint)}
  .seg button.on{background:var(--panel2); box-shadow:inset 0 0 0 2px var(--spalle); color:var(--text)}
  .seg .k{font-weight:800; font-size:19px; line-height:1}
  .seg .t{font-size:12px; margin-top:3px}
  .daterow{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 12px}
  input[type=date],input[type=text]{background:var(--panel); color:var(--text); border:1px solid var(--line);
       border-radius:10px; padding:8px 10px; font-size:14px}
  /* exercise card */
  .ex{display:flex; overflow:hidden; margin-bottom:10px}
  .ex .bar{width:6px; flex:none}
  .ex .body{flex:1; padding:12px}
  .ex .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
  .ex .name{font-weight:700; line-height:1.15}
  .ex .grp{font-size:12px; color:var(--muted); margin-top:2px}
  .chk{flex:none; width:44px; height:44px; border:2px solid var(--line); border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--faint)}
  .ex.done{opacity:.62}
  .ex.done .chk{border-color:var(--c); background:var(--c); color:var(--bg)}
  .stepper{display:flex; align-items:center; gap:8px; margin-top:12px}
  .stepper .pm{width:50px; height:50px; border-radius:13px; background:var(--panel2); border:1px solid var(--line);
       display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600}
  .stepper .pm:active{transform:scale(.94)}
  .val{flex:1; height:50px; background:var(--panel2); border-radius:13px; display:flex; align-items:baseline; justify-content:center; gap:4px}
  .val input{background:transparent; border:none; color:var(--text); width:70px; text-align:center; font-size:28px; font-weight:800; outline:none}
  .val .u{font-size:13px; color:var(--muted); font-weight:600}
  .note{width:100%; margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px; color:var(--text); font-size:14px; outline:none}
  /* fixed save + nav */
  .savebar{position:fixed; left:50%; transform:translateX(-50%); bottom:66px; width:100%; max-width:460px; padding:0 16px; pointer-events:none}
  .save{width:100%; pointer-events:auto; background:var(--spalle); color:#1a1206; border-radius:16px; padding:15px; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .save:active{transform:scale(.99)}
  .nav{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:460px; background:var(--panel); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1; padding:9px 0; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--faint); font-size:11px; font-weight:600}
  .nav button.on{color:var(--text)}
  .nav svg{width:22px; height:22px}
  /* misc */
  .badge{width:38px; height:38px; border-radius:10px; font-weight:800; display:flex; align-items:center; justify-content:center; color:var(--bg)}
  .pill{display:inline-flex; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700}
  .kv{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px}
  .kv .l{font-size:12px; color:var(--faint)} .kv .v{font-weight:700}
  .btn{border-radius:12px; padding:13px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; width:100%}
  .field{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 6px; text-align:center; font-weight:700; width:100%; outline:none; font-size:15px}
  details summary{cursor:pointer; font-weight:700; list-style:none}
  details summary::-webkit-details-marker{display:none}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:130px; background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px; display:flex; gap:8px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:20; opacity:0; transition:opacity .2s}
  .toast.show{opacity:1}
  .sync{font-size:12px; color:var(--faint); display:flex; align-items:center; gap:6px}
  .dot{width:7px; height:7px; border-radius:999px; background:var(--faint)}
  .dot.ok{background:var(--dorso)} .dot.err{background:#E06A6A} .dot.busy{background:var(--spalle)}
  .empty{text-align:center; padding:70px 24px; color:var(--muted)}
  code{background:var(--panel2); padding:1px 5px; border-radius:5px; font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo" id="logo">UPPER BODY <b>90</b></div>
    <div class="sub">palestrina</div>
  </div>
  <div id="content" class="content"></div>
</div>

<div id="savebar" class="savebar" style="display:none">
  <button class="save" data-act="saveSession"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span id="saveLbl">Salva sessione</span></button>
</div>

<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>

<!-- programma attivo, incluso lato server (Apps Script) -->
<?!= include('program') ?>
<script>
/* ===================== PROGRAMMA (incluso via HtmlService) ===================== */
const P = window.PROGRAM || {ex:{},workouts:{A:{title:"A",items:[]},B:{title:"B",items:[]}},baseline:{},height:1.73,targetFat:12,name:"Programma"};
const EX = P.ex;
const WK = P.workouts;
const BASELINE = P.baseline;
const HEIGHT = P.height || 1.73, TARGET = P.targetFat || 12;

/* ---------- stato ---------- */
let S = { sessions:[], measures:[], view:"allena", draft:null, sync:"—", syncState:"" };

const cache = {
  read(){ try{ return JSON.parse(localStorage.getItem("ub90")||"null"); }catch(e){ return null; } },
  write(){ try{ localStorage.setItem("ub90", JSON.stringify({sessions:S.sessions, measures:S.measures})); }catch(e){} },
  draftRead(){ try{ return JSON.parse(localStorage.getItem("ub90_draft")||"null"); }catch(e){ return null; } },
  draftWrite(){ try{ localStorage.setItem("ub90_draft", JSON.stringify(S.draft)); }catch(e){} },
};

const fmt=(n,d=1)=>(n===null||n===undefined||n===""||isNaN(n))?"–":Number(n).toLocaleString("it-IT",{maximumFractionDigits:d});
const today=()=>new Date().toISOString().slice(0,10);
const ddmm=iso=>{const p=String(iso).split("-");return p.length>=3?p[2]+"/"+p[1]:iso;};
const lastVals=()=>{const l={};S.sessions.forEach(s=>Object.entries(s.entries||{}).forEach(([k,v])=>{if(v!==null&&v!=="")l[k]=v;}));return l;};
const freshDraft=()=>{const l=lastVals();const v={};Object.keys(EX).forEach(k=>v[k]=(l[k]!==undefined?l[k]:EX[k].def));
  const wk=S.sessions.length?(S.sessions[S.sessions.length-1].type==="A"?"B":"A"):"A";
  return {workout:wk, date:today(), values:v, done:{}, note:""};};

/* ---------- sync (via google.script.run, same-origin, senza token) ---------- */
function gsRun(fn, arg){
  return new Promise(function(resolve, reject){
    if(!(window.google && google.script && google.script.run)){ reject(new Error("no-bridge")); return; }
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
  });
}
async function pull(){
  setSync("busy","sincronizzo…");
  try{
    const d = await gsRun("getState");
    S.sessions = Array.isArray(d.sessions)?d.sessions:[];
    S.measures = Array.isArray(d.measures)?d.measures:[];
    if(!S.measures.length){ S.measures=[BASELINE]; push(); }
    cache.write(); setSync("ok","sincronizzato "+hhmm()); render();
  }catch(e){ setSync("err","offline"); }
}
async function push(){
  cache.write();
  setSync("busy","salvo…");
  try{
    await gsRun("saveState", {sessions:S.sessions, measures:S.measures});
    setSync("ok","sincronizzato "+hhmm());
  }catch(e){ setSync("err","errore — riprova"); }
  if(S.view==="misure"||S.view==="info") render();
}
const hhmm=()=>new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
function setSync(state,txt){ S.syncState=state; S.sync=txt; const n=document.getElementById("syncline"); if(n) paintSync(n); }
function paintSync(n){ n.innerHTML='<span class="dot '+({busy:"busy",ok:"ok",err:"err"}[S.syncState]||"")+'"></span>'+S.sync; }

/* ---------- toast ---------- */
let tt;
function toast(t){ const n=document.getElementById("toast"); n.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+t; n.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>n.classList.remove("show"),1800); }

/* ---------- azioni ---------- */
function bump(k,dir){ const e=EX[k]; let v=Number(S.draft.values[k])||0; v=Math.max(0, Math.round((v+dir*e.step)*10)/10); S.draft.values[k]=v; const inp=document.getElementById("v_"+k); if(inp) inp.value=v; cache.draftWrite(); }
function typeVal(k,raw){ S.draft.values[k] = raw===""?"":Math.max(0,Number(raw)); cache.draftWrite(); }
function toggleDone(k){ S.draft.done[k]=!S.draft.done[k]; const card=document.querySelector('.ex[data-k="'+k+'"]'); if(card) card.classList.toggle("done",S.draft.done[k]); updateSaveLbl(); cache.draftWrite(); }
function updateSaveLbl(){ const it=WK[S.draft.workout].items; const d=it.filter(k=>S.draft.done[k]).length; const l=document.getElementById("saveLbl"); if(l) l.textContent="Salva sessione "+S.draft.workout+" · "+d+"/"+it.length; }

function saveSession(){
  const it=WK[S.draft.workout].items, entries={};
  it.forEach(k=>entries[k]=(S.draft.values[k]===""?null:S.draft.values[k]));
  S.sessions.push({id:Date.now(), date:S.draft.date, type:S.draft.workout, entries, note:(S.draft.note||"").trim()});
  S.draft=freshDraft(); cache.draftWrite(); push(); toast("Sessione salvata"); render();
}
function delSession(id){ S.sessions=S.sessions.filter(s=>s.id!==id); push(); render(); }
function addMeasure(){
  const w=val("m_w"), f=val("m_f"), g=val("m_g"), d=document.getElementById("m_d").value||today();
  if(w===""||isNaN(Number(w))){ toast("Metti almeno il peso"); return; }
  S.measures.push({id:Date.now(), date:d, weight:Number(w), fat:f===""?null:Number(f), waist:g===""?null:Number(g)});
  S.measures.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  push(); toast("Misura salvata"); render();
}
function delMeasure(id){ S.measures=S.measures.filter(m=>m.id!==id); push(); render(); }
const val=id=>{const n=document.getElementById(id);return n?n.value:"";};

function backup(){
  const blob=new Blob([JSON.stringify({sessions:S.sessions,measures:S.measures},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="palestrina-backup.json"; a.click();
}

/* ===================== RENDER ===================== */
const svgIcons={
  allena:'<path d="M6.5 6.5 17.5 17.5M21 21l-1-1M3 3l1 1M18 6l3-3M6 18l-3 3"/><rect x="5" y="5" width="4" height="4" rx="1"/><rect x="15" y="15" width="4" height="4" rx="1"/>',
  storico:'<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>',
  misure:'<path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4z"/><path d="M7 11l2 2M11 7l2 2M15 11l1 1"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
};
function navHTML(){
  return [["allena","Allena"],["storico","Storico"],["misure","Misure"],["info","Guida"]].map(([id,l])=>
    '<button data-nav="'+id+'" class="'+(S.view===id?"on":"")+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+svgIcons[id]+'</svg>'+l+'</button>').join("");
}

function render(){
  document.getElementById("nav").innerHTML=navHTML();
  const c=document.getElementById("content");
  document.getElementById("savebar").style.display = S.view==="allena" ? "block" : "none";
  if(S.view==="allena") c.innerHTML=renderAllena();
  else if(S.view==="storico") c.innerHTML=renderStorico();
  else if(S.view==="misure") c.innerHTML=renderMisure();
  else if(S.view==="info") c.innerHTML=renderInfo();
  const sc=document.getElementById("syncline"); if(sc) paintSync(sc);
  if(S.view==="allena") updateSaveLbl();
}

function renderAllena(){
  const d=S.draft, it=WK[d.workout].items;
  let h='<div class="seg">'+["A","B"].map(w=>'<button data-wk="'+w+'" class="'+(d.workout===w?"on":"")+'"><span class="k">'+w+'</span><span class="t">'+WK[w].title+'</span></button>').join("")+'</div>';
  h+='<div class="daterow"><span class="small muted">Data della sessione</span><input type="date" id="d_date" data-date value="'+d.date+'"></div>';
  h+=it.map(k=>{const e=EX[k],done=d.done[k]?" done":"";return (
    '<div class="ex card'+done+'" data-k="'+k+'" style="--c:'+e.c+'">'+
      '<div class="bar" style="background:'+e.c+'"></div>'+
      '<div class="body">'+
        '<div class="top"><div><div class="name">'+e.name+(e.fav?' <span style="color:var(--spalle)">★</span>':'')+'</div>'+
        '<div class="grp">'+e.group+' · '+e.sets+'×'+e.reps+'</div></div>'+
        '<button class="chk" data-done="'+k+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button></div>'+
        '<div class="stepper"><button class="pm" data-minus="'+k+'">−</button>'+
        '<div class="val"><input id="v_'+k+'" data-vk="'+k+'" inputmode="decimal" value="'+d.values[k]+'"><span class="u">'+e.unit+'</span></div>'+
        '<button class="pm" data-plus="'+k+'">+</button></div>'+
      '</div></div>');}).join("");
  h+='<input class="note" data-notefield placeholder="Nota (facoltativa): come è andata…" value="'+(d.note||"").replace(/"/g,"&quot;")+'">';
  return h;
}

function renderStorico(){
  if(!S.sessions.length) return '<div class="empty"><div style="font-weight:700;color:var(--text)">Ancora nessuna sessione</div><div class="small">Completa il primo allenamento e premi Salva. Comparirà qui.</div></div>';
  let h='<div class="small muted" style="margin:2px 4px 10px">'+S.sessions.length+' sessioni salvate</div>';
  h+=S.sessions.slice().reverse().map(s=>{const it=WK[s.type].items;const col=s.type==="A"?"var(--petto)":"var(--dorso)";
    let rows=it.map(k=>'<div class="row" style="justify-content:space-between; font-size:14px; margin:3px 0"><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+EX[k].name+'</span><span style="font-weight:700;margin-left:8px;white-space:nowrap">'+(s.entries[k]==null?"–":fmt(s.entries[k])+" "+EX[k].unit)+'</span></div>').join("");
    return '<div class="card" style="margin-bottom:10px;overflow:hidden">'+
      '<button data-open="'+s.id+'" class="row" style="width:100%;justify-content:space-between;padding:12px">'+
        '<span class="row" style="gap:12px"><span class="badge" style="background:'+col+'">'+s.type+'</span>'+
        '<span style="text-align:left"><span style="font-weight:700;display:block">'+ddmm(s.date)+' · '+WK[s.type].title+'</span>'+
        '<span class="tiny muted">'+it.filter(k=>s.entries[k]!=null).length+' esercizi'+(s.note?' · nota':'')+'</span></span></span>'+
        '<span class="faint">▾</span></button>'+
      '<div id="det_'+s.id+'" style="display:none;border-top:1px solid var(--line);padding:10px 12px">'+
        '<div class="kv" style="grid-template-columns:1fr">'+rows+'</div>'+
        (s.note?'<div class="small muted" style="margin-top:6px;font-style:italic">“'+s.note+'”</div>':'')+
        '<button data-delses="'+s.id+'" class="small" style="color:#E06A6A;margin-top:10px">Elimina</button>'+
      '</div></div>';}).join("");
  return h;
}

function renderMisure(){
  const m=S.measures, last=m.length?m[m.length-1]:null, first=m.length?m[0]:null;
  const lean=last&&last.fat!=null?last.weight*(1-last.fat/100):null;
  const fatM=last&&last.fat!=null?last.weight*last.fat/100:null;
  const wT=lean!=null?lean/(1-TARGET/100):null;
  const toGo=wT!=null?last.weight-wT:null;
  const bmi=last?last.weight/(HEIGHT*HEIGHT):null;
  let h="";
  if(last){
    h+='<div class="card" style="padding:16px;margin-bottom:12px">'+
      '<div class="row" style="justify-content:space-between;align-items:flex-end">'+
        '<div><div class="tiny faint" style="text-transform:uppercase;letter-spacing:1px">Peso attuale</div>'+
        '<div style="font-size:38px;font-weight:800;line-height:1;margin-top:4px">'+fmt(last.weight)+'<span style="font-size:18px;font-weight:700;color:var(--muted)"> kg</span></div>'+
        '<div class="tiny muted" style="margin-top:4px">BMI '+fmt(bmi)+(first&&first.id!==last.id?' · '+((last.weight-first.weight)>0?"+":"")+fmt(last.weight-first.weight)+' kg dal via':'')+'</div></div>'+
        spark(m.map(x=>x.weight))+'</div>';
    if(last.fat!=null){
      h+='<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px" class="kv">'+
        cell("Grasso",fmt(last.fat)+" %")+cell("Massa magra",fmt(lean)+" kg")+
        cell("Massa grassa",fmt(fatM)+" kg")+cell("Girovita",last.waist!=null?fmt(last.waist)+" cm":"–")+
        cell("Peso al "+TARGET+"%",fmt(wT)+" kg","var(--dorso)")+cell("Ancora circa",toGo!=null?fmt(Math.max(0,toGo))+" kg":"–","var(--spalle)")+'</div>'+
        '<div class="tiny faint" style="margin-top:8px">Addominali visibili ~10–12%. Ora sei al '+fmt(last.fat)+'%.</div>';
    }
    h+='</div>';
  }
  h+='<div class="card" style="padding:16px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:8px">Nuova misura</div>'+
    '<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="small muted">Data</span><input type="date" id="m_d" value="'+today()+'"></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+
      field("Peso kg","m_w")+field("% grasso","m_f")+field("Girovita cm","m_g")+'</div>'+
    '<button class="btn" data-act="addMeasure" style="background:var(--dorso);color:#10160a;margin-top:12px">+ Aggiungi misura</button>'+
    '<div class="tiny faint" style="margin-top:8px">Misura appena sveglio, a digiuno: conta il trend, non il singolo numero.</div></div>';
  if(m.length>1){
    h+='<div class="card" style="overflow:hidden">'+m.slice().reverse().map(x=>
      '<div class="row" style="justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px">'+
      '<span class="muted" style="width:44px">'+ddmm(x.date)+'</span>'+
      '<span style="font-weight:700;flex:1">'+fmt(x.weight)+' kg</span>'+
      '<span class="muted" style="width:52px;text-align:right">'+(x.fat!=null?fmt(x.fat)+"%":"")+'</span>'+
      '<span class="muted" style="width:56px;text-align:right">'+(x.waist!=null?fmt(x.waist)+"cm":"")+'</span>'+
      '<button data-delmis="'+x.id+'" class="faint" style="margin-left:8px">✕</button></div>').join("")+'</div>';
  }
  return h;
}
const cell=(l,v,col)=>'<div><div class="l">'+l+'</div><div class="v" style="color:'+(col||"var(--text)")+'">'+v+'</div></div>';
const field=(l,id)=>'<div><div class="tiny faint" style="margin-bottom:4px">'+l+'</div><input id="'+id+'" class="field" inputmode="decimal"></div>';
function spark(data){
  if(!data||data.length<2) return '<span class="tiny faint">un dato</span>';
  const w=96,h=40,mn=Math.min(...data),mx=Math.max(...data),rg=(mx-mn)||1;
  const pts=data.map((v,i)=>[8+(i/(data.length-1))*(w-16), h-6-((v-mn)/rg)*(h-12)]);
  const p=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  return '<svg width="'+w+'" height="'+h+'"><path d="'+p+'" fill="none" stroke="var(--spalle)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map((q,i)=>'<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i===pts.length-1?3:1.6)+'" fill="'+(i===pts.length-1?"var(--spalle)":"var(--muted)")+'"/>').join("")+'</svg>';
}

function renderInfo(){
  let h='<div class="card" style="padding:16px;margin-bottom:12px">'+
    '<div class="row" style="justify-content:space-between"><div style="font-weight:700">Sincronizzazione</div><div class="sync" id="syncline"></div></div>'+
    '<div class="small muted" style="margin-top:6px">I dati stanno nel tuo Foglio Google: iPhone e PC che aprono questo indirizzo vedono le stesse cose.</div>'+
    '<button class="btn" data-act="pull" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);margin-top:10px">↻ Sincronizza ora</button>'+
    '<button class="btn" data-act="backup" style="background:transparent;color:var(--muted);margin-top:8px">Scarica backup .json</button></div>';
  h+='<div class="card" style="padding:16px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:6px">Come usarla in palestra</div>'+
    '<p class="small muted" style="margin:0">Scegli A o B, regola i pesi con − e +, spunta ✓ ogni esercizio finito, poi <b style="color:var(--text)">Salva sessione</b>: va nello Storico e la schermata si ripulisce, già pronta con i pesi dell\'ultima volta.</p>'+
    '<p class="small muted" style="margin:8px 0 0"><b style="color:var(--text)">Peso:</b> scegli il carico dove le ultime 1–2 ripetizioni sono difficili ma pulite. Sali di una tacca solo quando chiudi in cima al range con margine.</p></div>';
  h+='<details class="card" style="padding:16px;margin-bottom:12px"><summary>Come si esegue ogni esercizio</summary><div style="margin-top:12px">'+
    Object.values(EX).map(e=>'<div style="display:flex;gap:10px;margin-bottom:12px"><div style="width:4px;border-radius:9px;background:'+e.c+';flex:none"></div>'+
    '<div><div style="font-weight:700;font-size:14px">'+e.name+' <span class="faint" style="font-weight:400">· '+e.sets+'×'+e.reps+'</span></div>'+
    '<div class="small muted">'+e.cue+'</div></div></div>').join("")+'</div></details>';
  h+='<div class="tiny faint" style="text-align:center;padding-bottom:8px">'+(P.name||"Palestrina")+' · backend: il tuo Foglio Google</div>';
  return h;
}

/* ===================== EVENTI ===================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-wk],[data-minus],[data-plus],[data-done],[data-open],[data-delses],[data-delmis],[data-act]");
  if(!t) return;
  if(t.dataset.nav){ S.view=t.dataset.nav; render(); }
  else if(t.dataset.wk){ S.draft.workout=t.dataset.wk; cache.draftWrite(); render(); }
  else if(t.dataset.minus){ bump(t.dataset.minus,-1); }
  else if(t.dataset.plus){ bump(t.dataset.plus,1); }
  else if(t.dataset.done){ toggleDone(t.dataset.done); }
  else if(t.dataset.open){ const d=document.getElementById("det_"+t.dataset.open); if(d) d.style.display=d.style.display==="none"?"block":"none"; }
  else if(t.dataset.delses){ delSession(Number(t.dataset.delses)); }
  else if(t.dataset.delmis){ delMeasure(Number(t.dataset.delmis)); }
  else if(t.dataset.act){ ({saveSession,addMeasure,backup,pull})[t.dataset.act](); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.vk) typeVal(t.dataset.vk,t.value);
  else if(t.dataset.date){ S.draft.date=t.value; cache.draftWrite(); }
  else if(t.hasAttribute("data-notefield")){ S.draft.note=t.value; cache.draftWrite(); }
});

/* ===================== INIT ===================== */
(function init(){
  // titolo e logo dal programma attivo
  const nm=(P.name||"Palestrina").split(" ");
  const lg=document.getElementById("logo"); if(lg) lg.innerHTML=nm.slice(0,-1).join(" ")+" <b>"+nm.slice(-1)+"</b>";
  document.title=P.name||"Palestrina";
  const cx=cache.read();
  if(cx){ S.sessions=cx.sessions||[]; S.measures=cx.measures||[]; }
  if(!S.measures.length) S.measures=[BASELINE];
  const dr=cache.draftRead();
  S.draft = dr || freshDraft();
  // completa eventuali chiavi mancanti nel draft
  const l=lastVals(); Object.keys(EX).forEach(k=>{ if(S.draft.values[k]===undefined) S.draft.values[k]=(l[k]!==undefined?l[k]:EX[k].def); });
  render();
  pull();
})();
</script>
</body>
</html>
